[package]
name = "knock-knock"
version = "0.2.0"
edition = "2024"
description = "knock-knock joke webservice"

[dependencies]
askama = "0.15.6"
axum = "0.8.9"
axum-extra = { version = "0.12.6", features = ["typed-header"] }
chrono = "0.4.44"
clap = { version = "4.6.1", features = ["derive", "env", "unicode", "wrap_help", "cargo"] }
jsonwebtoken = "10.3.0"
serde = { version = "1.0.228", features = ["derive", "serde_derive"] }
serde_json = "1.0.149"
sqlx = { version = "0.8.6", features = ["postgres", "migrate", "runtime-tokio-rustls"] }
thiserror = "2.0.18"
tokio = { version = "1.52.1", features = ["full"] }
tower-http = { version = "0.6.8", features = ["trace", "full"] }
tower-sessions = "0.15.0"
tracing = { version = "0.1.44", features = ["async-await"] }
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
utoipa = { version = "5.4.0", features = ["axum_extras"] }
utoipa-rapidoc = { version = "6.0.0", features = ["axum"] }
utoipa-redoc = { version = "6.0.0", features = ["axum"] }
utoipa-swagger-ui = { version = "9.0.2", features = ["axum"] }
